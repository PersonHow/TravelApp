name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: travel
          POSTGRES_PASSWORD: travel_test_password
          POSTGRES_DB: travel_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U travel -d travel_app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://travel:travel_test_password@localhost:5432/travel_app
      JWT_SECRET: ci-only-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm audit --omit=dev --workspace @travel-app/api
      - run: docker build -f apps/api/Dockerfile -t travel-app-api:ci .
